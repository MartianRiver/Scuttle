# ---------------------------------------------------------------------------
#  FIXED PRICES
# ---------------------------------------------------------------------------
# Things with no recipe to work from, so Scuttle can't calculate them. These
# are the "you can't normally get this" items — priced high on purpose, so
# they're a real event rather than pocket change.
#
# A price here is final. Scuttle never talks itself below one of these.
overrides:
  BEDROCK: 5000
  SPAWNER: 8000
  TRIAL_SPAWNER: 8000
  VAULT: 8000
  BUDDING_AMETHYST: 4000
  END_PORTAL_FRAME: 6000
  DRAGON_EGG: 50000
  ELYTRA: 12000
  TOTEM_OF_UNDYING: 2000
  ENCHANTED_GOLDEN_APPLE: 5000
  TRIDENT: 1500
  HEART_OF_THE_SEA: 3000
  SADDLE: 300
  NAME_TAG: 300
  LEAD: 60
  REINFORCED_DEEPSLATE: 4000


# ---------------------------------------------------------------------------
#  NEVER
# ---------------------------------------------------------------------------
# Scuttle will not trade these at any price and cannot be talked into it —
# this list is enforced in the plugin's code, not by asking Scuttle nicely.
# These are the ones that let someone rewrite the server, not just cheat a bit.
never-trade:
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - DEBUG_STICK
  - BARRIER
  - LIGHT
  - KNOWLEDGE_BOOK
