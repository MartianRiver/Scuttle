# ============================================================================
#  What things are worth
#  ---------------------------------------------------------------------------
#  Scuttle prices a trade in "credits". A credit isn't money and nobody sees the
#  number — it's just how Scuttle works out whether a swap is fair.
#
#  You only price RAW materials here: things you dig up, grow, or get off a mob.
#  Everything else Scuttle works out for itself by reading the server's own
#  recipe book. An iron block is nine iron ingots because the game says it is.
#
#  That matters more than it sounds. It means nobody can buy cheap, craft, and
#  sell dear — a crafted thing is never worth more than the parts that made it,
#  because that's literally how the number is calculated.
#
#  After editing, run:   /scuttle reload
# ============================================================================


# ---------------------------------------------------------------------------
#  RAW MATERIALS
# ---------------------------------------------------------------------------
# Roughly: how much of a faff is this to get hold of?
# Dirt is 1. A diamond is 320. Feel free to argue with any of it.
base:

  # --- stone and dirt: everywhere, worth almost nothing
  DIRT: 1
  COARSE_DIRT: 1
  ROOTED_DIRT: 1
  GRASS_BLOCK: 2
  PODZOL: 3
  MYCELIUM: 8
  MUD: 2
  CLAY_BALL: 4
  SAND: 1
  RED_SAND: 2
  GRAVEL: 2
  FLINT: 4
  COBBLESTONE: 1
  COBBLED_DEEPSLATE: 3
  # Cobblestone and stone stay at 1 on purpose. Both are infinitely renewable
  # from a cobble generator, which kids build, so any price above a token one is
  # a money printer. The reward for digging lives in what you cannot farm.
  #
  # Price what the PICKAXE DROPS, not the tidy version: mining deepslate gives
  # you cobbled deepslate, and the smelted block is one nobody carries home.
  #
  # The two of them have to move TOGETHER. Deepslate smelts from cobbled and
  # cobbled cuts back from deepslate, so whichever is left cheap drags the other
  # down to it and the raise quietly does nothing. Raising only one of them is
  # exactly the mistake made here first; the DEBUG undercut line is what caught
  # it. Check that line after editing anything in this section.
  #
  # Granite, diorite and andesite are all craftable from cobblestone and quartz,
  # so the recipe is their ceiling however this file is edited. That's the
  # by-construction rule working, not a bug: leave them at what it allows.
  STONE: 1
  DEEPSLATE: 3
  TUFF: 3
  CALCITE: 5
  DRIPSTONE_BLOCK: 5
  GRANITE: 3
  DIORITE: 3
  ANDESITE: 2
  OBSIDIAN: 60
  MOSS_BLOCK: 12
  SNOWBALL: 1
  ICE: 6

  # --- ores. The raw drop and the ore block are priced separately because
  #     silk-touching an ore block is more work than just mining it.
  COAL: 8
  RAW_COPPER: 20
  COPPER_ORE: 22
  RAW_IRON: 40
  IRON_ORE: 45
  DEEPSLATE_IRON_ORE: 45
  RAW_GOLD: 90
  GOLD_ORE: 95
  # Smelts straight to an ingot, so pricing it under raw gold would make raw
  # gold worth more than the bar it becomes.
  NETHER_GOLD_ORE: 95
  REDSTONE: 12
  LAPIS_LAZULI: 25
  QUARTZ: 15
  DIAMOND: 320
  DEEPSLATE_DIAMOND_ORE: 340
  EMERALD: 400
  AMETHYST_SHARD: 30
  ANCIENT_DEBRIS: 2000
  NETHERITE_SCRAP: 2000

