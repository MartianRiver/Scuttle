<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scuttle chat lab</title>
<style>
  :root {
    --bg: #14100e;
    --panel: #1d1815;
    --edge: #322a25;
    --ink: #c8c3bd;
    --dim: #7a716a;
    --prefix: #5a5a5a;
    --ember: #d2691e;
    --you: #9fd3c7;
    --bad: #d2544e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 330px;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; height: auto; } }

  main { display: flex; flex-direction: column; min-height: 0; }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--edge);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; color: var(--ember); font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }

  #log { flex: 1; overflow-y: auto; padding: 14px 16px; min-height: 300px; }
  .line { margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  .line .prefix { color: var(--prefix); }
  .line .name { color: var(--ember); }
  .line.you .name { color: var(--you); }
  .tool {
    color: var(--dim); font-size: 12px; margin: 2px 0 6px 0;
    border-left: 2px solid var(--edge); padding-left: 8px;
  }
  .tool b { color: #9a8f86; font-weight: 600; }
  .cost { color: var(--dim); font-size: 11px; margin: -4px 0 10px 0; }
  .error { color: var(--bad); }
  .empty { color: var(--dim); font-style: italic; }

  form#say { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--edge); }
  input, select, textarea, button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
    border-radius: 3px; padding: 7px 9px; font: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--ember); }
  #msg { flex: 1; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ember); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  aside {
    border-left: 1px solid var(--edge); background: var(--panel);
    overflow-y: auto; padding: 12px 14px;
  }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--dim); margin: 18px 0 8px; font-weight: 600;
  }
  aside h2:first-child { margin-top: 0; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 8px 0 3px; }
  aside input, aside select, aside textarea { width: 100%; }
  textarea { resize: vertical; font-size: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .totals { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .warn {
    background: #2a1a16; border: 1px solid #6a3a30; color: #e6b0a8;
    padding: 8px; border-radius: 3px; font-size: 12px; margin-bottom: 12px;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Scuttle chat lab</h1>
    <span class="meta" id="status">loading…</span>
  </header>

  <div id="log">
    <p class="empty">Nothing said yet. Ask Scuttle something — try "scuttle how do I make a hopper?"</p>
  </div>

  <form id="say">
    <input id="msg" placeholder="say something to Scuttle…" autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
    <button type="button" id="reset" title="Clear the conversation window">Reset</button>
  </form>
</main>

<aside>
  <div id="keywarn" class="warn" hidden>
    No API key found. Put <code>OPENROUTER_API_KEY=…</code> in <code>.env</code> at the repo root
    and restart the lab.
  </div>

  <h2>Model</h2>
  <select id="model">
    <option value="anthropic/claude-sonnet-5">claude-sonnet-5 (chat default)</option>
    <option value="anthropic/claude-haiku-4.5">claude-haiku-4.5 (cheap)</option>
    <option value="anthropic/claude-opus-5">claude-opus-5 (authoring)</option>
  </select>

  <label for="reading">Reading level</label>
  <select id="reading">
    <option>under-8</option>
    <option selected>8-11</option>
    <option>12-plus</option>
    <option>mixed</option>
  </select>

  <h2>Who's talking</h2>
  <div class="row2">
    <div><label for="player">Name</label><input id="player" value="Kid"></div>
    <div><label for="tier">Tier</label>
      <select id="tier"><option>kid</option><option>builder</option><option>parent</option></select>
    </div>
  </div>

  <h2>Where they are</h2>
  <div class="row">
    <div><label for="x">x</label><input id="x" type="number" value="-25"></div>
    <div><label for="y">y</label><input id="y" type="number" value="87"></div>
    <div><label for="z">z</label><input id="z" type="number" value="-50"></div>
  </div>
  <label for="biome">Biome</label>
  <input id="biome" value="plains">
  <label for="dimension">Dimension</label>
  <select id="dimension">
    <option>the Overworld</option><option>the Nether</option><option>the End</option>
  </select>
  <div class="row2">
    <div><label for="time">Time</label>
      <select id="time">
        <option>sunrise</option><option>morning</option><option selected>midday</option>
        <option>afternoon</option><option>sunset</option><option>night</option>
        <option>the small hours</option><option>just before dawn</option>
      </select>
    </div>
    <div><label for="weather">Weather</label>
      <select id="weather">
        <option>clear</option><option>raining</option><option>a thunderstorm</option>
      </select>
    </div>
  </div>
  <label for="held">Holding</label>
  <input id="held" value="nothing">
  <div class="row2">
    <div><label for="health">Health</label><input id="health" type="number" min="0" max="20" value="20"></div>
    <div><label for="food">Hunger</label><input id="food" type="number" min="0" max="20" value="20"></div>
  </div>
  <label for="nearby">Nearby blocks (comma separated)</label>
  <input id="nearby" value="crafting table, furnace">
  <label for="recent">Recent chat (one line each)</label>
  <textarea id="recent" rows="3" placeholder="Maya: anyone got spare iron?"></textarea>

  <h2>Lore file</h2>
  <textarea id="lore" rows="10" placeholder="What Scuttle knows about your server…"></textarea>
  <button type="button" id="savelore" style="margin-top:6px">Save lore.txt</button>

  <div class="totals" id="totals">no spend yet this session</div>
</aside>

<script>
const $ = id => document.getElementById(id);
const log = $("log");
let history = [];
let totalCost = 0, totalTurns = 0;

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function clearEmpty() {
  const placeholder = log.querySelector(".empty");
  if (placeholder) placeholder.remove();
}

function addLine(who, text, isYou) {
  clearEmpty();
  const div = document.createElement("div");
  div.className = "line" + (isYou ? " you" : "");
  div.innerHTML = isYou
    ? `<span class="name">${esc(who)}:</span> ${esc(text)}`
    : `<span class="prefix">[Scuttle]</span> <span class="name">Scuttle:</span> ${esc(text)}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addNote(html, cls) {
  clearEmpty();
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function context() {
  return {
    player: $("player").value || "Kid",
    tier: $("tier").value,
    x: +$("x").value, y: +$("y").value, z: +$("z").value,
    biome: $("biome").value,
    dimension: $("dimension").value,
    time: $("time").value,
    weather: $("weather").value,
    held: $("held").value || "nothing",
    health: +$("health").value,
    food: +$("food").value,
    nearby: $("nearby").value,
    recentChat: $("recent").value,
  };
}

async function send(text) {
  addLine($("player").value || "Kid", text, true);
  const pending = addNote('<span class="empty">…rattling…</span>', "tool");
  $("send").disabled = true;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        history,
        context: context(),
        model: $("model").value,
        readingLevel: $("reading").value,
        lore: $("lore").value,
      }),
    });
    const data = await response.json();
    pending.remove();

    if (data.error) {
      addNote(`<span class="error">${esc(data.error)}</span>`, "line");
      return;
    }

    for (const call of data.tools || []) {
      addNote(`<b>${esc(call.name)}</b>(${esc(JSON.stringify(call.args))})<br>→ ${esc(call.result)}`, "tool");
    }
    addLine("Scuttle", data.reply || "(said nothing)", false);
    const cached = data.cachedTokens ? ` (${data.cachedTokens} cached)` : "";
    addNote(
      `$${data.cost.toFixed(5)} · ${data.promptTokens}+${data.completionTokens} tokens${cached} · ` +
      `${esc(data.model)} · ${data.ms}ms`, "cost");

    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: data.reply || "" });
    while (history.length > 10) history.shift();

    totalCost += data.cost;
    totalTurns++;
    $("totals").textContent =
      `${totalTurns} turn${totalTurns === 1 ? "" : "s"} · $${totalCost.toFixed(4)} this session`;
  } catch (e) {
    pending.remove();
    addNote(`<span class="error">Lab server unreachable: ${esc(e.message)}</span>`, "line");
  } finally {
    $("send").disabled = false;
    $("msg").focus();
  }
}

$("say").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  send(text);
});

$("reset").addEventListener("click", () => {
  history = [];
  log.innerHTML = '<p class="empty">Conversation cleared. Scuttle has forgotten everything.</p>';
});

$("savelore").addEventListener("click", async () => {
  const button = $("savelore");
  button.disabled = true;
  button.textContent = "saving…";
  try {
    await fetch("/api/lore", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lore: $("lore").value }),
    });
    button.textContent = "saved";
  } catch {
    button.textContent = "save failed";
  }
  setTimeout(() => { button.textContent = "Save lore.txt"; button.disabled = false; }, 1200);
});

(async function load() {
  try {
    const state = await (await fetch("/api/state")).json();
    $("lore").value = state.lore || "";
    $("keywarn").hidden = state.hasKey;
    $("status").textContent = state.hasKey
      ? `key loaded · ${state.personaSections.length} persona sections`
      : "no API key";
  } catch (e) {
    $("status").textContent = "lab server not responding";
  }
})();
</script>
</body>
</html>
